<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autenticando - StudyCert</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/auth.js" defer></script>
    <style>
        .callback-container {
            max-width: 400px;
            margin: 100px auto;
            padding: 30px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
        }
        
        .spinner {
            width: 60px;
            height: 60px;
            border: 5px solid #f3f3f3;
            border-top: 5px solid var(--secondary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .success-icon {
            font-size: 3rem;
            color: var(--success);
            margin-bottom: 20px;
        }
        
        .error-icon {
            font-size: 3rem;
            color: var(--accent);
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="callback-container">
        <div class="spinner" id="spinner"></div>
        <i class="fas fa-check-circle success-icon" id="successIcon" style="display: none;"></i>
        <i class="fas fa-exclamation-circle error-icon" id="errorIcon" style="display: none;"></i>
        
        <h2 id="statusTitle" style="color: var(--primary); margin-bottom: 10px;">Autenticando...</h2>
        <p id="statusMessage" style="color: #666;">Por favor, aguarde enquanto processamos sua autenticação.</p>
        
        <button id="retryButton" class="btn btn-primary" style="margin-top: 20px; display: none;" onclick="retryAuth()">
            <i class="fas fa-redo"></i> Tentar Novamente
        </button>
        
        <a id="homeButton" href="index.html" class="btn btn-outline" style="margin-top: 20px; display: none;">
            <i class="fas fa-home"></i> Voltar para o Site
        </a>
    </div>
    
    <script>
        // Inicializar Supabase
        let supabaseClient;
        
        async function initSupabase() {
            try {
                const SUPABASE_URL = 'https://uhbwudgdeyvbkqoflaqw.supabase.co';
                const SUPABASE_KEY = 'sb_publishable_cmUH9ytPbQ1N3fyPiCU4CA_TrAuK5i4';
                
                if (typeof supabase !== 'undefined') {
                    supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
                        auth: {
                            autoRefreshToken: true,
                            persistSession: true,
                            detectSessionInUrl: true,
                            storage: window.localStorage,
                            storageKey: 'studycert-auth'
                        }
                    });
                    
                    console.log('✅ Supabase inicializado no callback');
                    return true;
                }
                return false;
            } catch (error) {
                console.error('❌ Erro ao inicializar Supabase:', error);
                return false;
            }
        }

                // Primeiro, inicializar o Supabase
                const initialized = await initSupabase();

                }
                
                // Obter a sessão atual (isso processa o token da URL)

    function isResetAction() {
        const urlParams = new URLSearchParams(window.location.search);
        return urlParams.get('action') === 'reset';
    }
    
    async function handleResetCallback() {
        try {
            console.log('🔄 Processando callback para reset de senha...');
            
            // Obter a sessão
            const { data: { session }, error: sessionError } = await supabaseClient.auth.getSession();
            
            if (sessionError || !session) {
                throw new Error('Falha na autenticação para reset de senha');
            }
            
            // Se for reset de senha, redirecionar para a página de reset com o token
            const accessToken = session.access_token;
            
            if (accessToken) {
                // Armazenar o token no localStorage
                localStorage.setItem('recovery_token', accessToken);
                
                // Redirecionar para a página de reset
                window.location.href = 'https://studycert.github.io/it-certification/reset-password.html';
            } else {
                throw new Error('Token de acesso não encontrado');
            }
            
        } catch (error) {
            console.error('❌ Erro no callback de reset:', error);
            showError('Erro no processo de recuperação. Tente novamente.', true);
        }
    }

        function showSuccess(message) {
            document.getElementById('spinner').style.display = 'none';
            document.getElementById('successIcon').style.display = 'block';
            document.getElementById('statusTitle').textContent = 'Sucesso!';
            document.getElementById('statusMessage').textContent = message;
            document.getElementById('statusTitle').style.color = 'var(--success)';
            document.getElementById('homeButton').style.display = 'inline-block';
        }
        
        function showError(message, showRetry = false) {
            document.getElementById('spinner').style.display = 'none';
            document.getElementById('errorIcon').style.display = 'block';
            document.getElementById('statusTitle').textContent = 'Erro na Autenticação';
            document.getElementById('statusMessage').textContent = message;
            document.getElementById('statusTitle').style.color = 'var(--accent)';
            document.getElementById('homeButton').style.display = 'inline-block';
            
            if (showRetry) {
                document.getElementById('retryButton').style.display = 'inline-block';
            }
        }
        
        function redirectToHome() {
            // Redirecionar para a página principal
            window.location.href = 'https://studycert.github.io/it-certification/index.html';
        }
        
        function retryAuth() {
            // Voltar para a página de login
            window.location.href = 'https://studycert.github.io/it-certification/index.html#login';
        }
        
        // Iniciar o processamento quando a página carregar
        document.addEventListener('DOMContentLoaded', async () => {
            console.log('📱 Página de callback carregada');
            
            // Pequeno delay para garantir que tudo está carregado
            setTimeout(async () => {
                await processOAuthCallback();
            }, 500);
        });
        
        // Também tentar processar quando a página terminar de carregar completamente
        window.addEventListener('load', async () => {
            console.log('🚀 Página totalmente carregada, processando auth...');
        });
    </script>
</body>
</html>
