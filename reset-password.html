<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redefinir Senha - StudyCert</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/auth.js" defer></script>
    <style>
        .reset-password-container {
            max-width: 400px;
            margin: 100px auto;
            padding: 30px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
        }
        
        .reset-password-container h2 {
            color: var(--primary);
            margin-bottom: 20px;
        }
        
        .reset-password-container p {
            color: #666;
            margin-bottom: 30px;
        }
        
        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: var(--secondary);
            text-decoration: none;
        }
        
        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="reset-password-container">
        <div class="logo" style="justify-content: center; margin-bottom: 20px;">
            <i class="fas fa-graduation-cap"></i>
            <h2 style="margin: 0;">Study<span style="color: #3498db;">Cert</span></h2>
        </div>
        
        <h2>Redefinir Senha</h2>
        <p>Digite sua nova senha abaixo</p>
        
        <div id="resetMessage" class="message" style="display: none; margin-bottom: 20px;"></div>
        
        <div class="form-group">
            <label for="newPassword">Nova Senha</label>
            <div style="position: relative; width: 100%;">
                <input type="password" id="newPassword" placeholder="Nova senha" 
                       style="width: 100%; padding: 12px 45px 12px 12px; border: 2px solid #e1e1e1; border-radius: 6px; font-size: 16px;">
                <button type="button" class="password-toggle" onclick="togglePasswordVisibility('newPassword')" 
                        style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; color: #666; cursor: pointer; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; padding: 0;">
                    <i class="fas fa-eye"></i>
                </button>
            </div>
        </div>
        
        <div class="form-group">
            <label for="confirmPassword">Confirmar Nova Senha</label>
            <div style="position: relative; width: 100%;">
                <input type="password" id="confirmPassword" placeholder="Confirmar nova senha" 
                       style="width: 100%; padding: 12px 45px 12px 12px; border: 2px solid #e1e1e1; border-radius: 6px; font-size: 16px;">
                <button type="button" class="password-toggle" onclick="togglePasswordVisibility('confirmPassword')" 
                        style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; color: #666; cursor: pointer; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; padding: 0;">
                    <i class="fas fa-eye"></i>
                </button>
            </div>
        </div>
        
        <button class="btn btn-primary" onclick="resetPassword()" style="width: 100%; padding: 12px; font-size: 1rem;">
            <i class="fas fa-key"></i> Redefinir Senha
        </button>
        
        <a href="index.html" class="back-link">
            <i class="fas fa-arrow-left"></i> Voltar para o login
        </a>
    </div>
    
    <script>
        async function togglePasswordVisibility(fieldId) {
            const field = document.getElementById(fieldId);
            if (!field) return;
            
            const icon = field.nextElementSibling?.querySelector('i');
            if (!icon) return;
            
            if (field.type === 'password') {
                field.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                field.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }
        
        async function resetPassword() {
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const messageDiv = document.getElementById('resetMessage');
            
            // Validações
            if (!newPassword || !confirmPassword) {
                showMessage('Por favor, preencha todos os campos', 'error');
                return;
            }
            
            if (newPassword.length < 6) {
                showMessage('A senha deve ter pelo menos 6 caracteres', 'error');
                return;
            }
            
            if (newPassword !== confirmPassword) {
                showMessage('As senhas não coincidem', 'error');
                return;
            }
            
            try {
                showMessage('Redefinindo senha...', 'info');
                
                const result = await authManager.resetPassword(newPassword);
                
                if (result.success) {
                    showMessage(
                        '<div style="text-align: center;">' +
                        '<i class="fas fa-check-circle" style="color: #27ae60; font-size: 2rem; margin-bottom: 10px;"></i><br>' +
                        '<strong style="color: #27ae60;">Senha redefinida com sucesso!</strong><br><br>' +
                        '<p>Redirecionando para login...</p>' +
                        '</div>', 
                        'success'
                    );
                    
                    // Redirecionar após 3 segundos
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 3000);
                } else {
                    showMessage('Erro: ' + result.error, 'error');
                }
            } catch (error) {
                console.error('Erro ao redefinir senha:', error);
                showMessage('Erro ao redefinir senha. Tente novamente.', 'error');
            }
        }
        
        function showMessage(message, type) {
            const element = document.getElementById('resetMessage');
            if (element) {
                element.innerHTML = message;
                element.className = `message ${type}`;
                element.style.display = 'block';
            }
        }
        
        // Verificar se há token de recuperação na URL
        document.addEventListener('DOMContentLoaded', () => {
            const hash = window.location.hash;
            if (hash.includes('type=recovery')) {
                console.log('Token de recuperação detectado na URL');
            }
        });
    </script>
</body>
</html>
